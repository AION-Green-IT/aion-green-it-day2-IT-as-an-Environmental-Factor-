  </g>
  <!-- Row 3 -->
  <g>
    <rect x="327" y="794" width="527" height="269" rx="18" fill="#EEE9F9" fill-opacity="0.6" stroke="#D9D3EA" stroke-width="2"/>
    <rect x="512" y="852" width="70" height="52" rx="4" fill="#3F3552" fill-opacity="0.85"/>
    <rect x="598" y="852" width="70" height="52" rx="4" fill="#3F3552" fill-opacity="0.6"/>
