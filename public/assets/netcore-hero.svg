<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1117" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <rect width="2048" height="1117" fill="#FFFFFF"/>
  <rect x="8" y="8" width="2032" height="1101" rx="24" fill="#FAF8FE" stroke="#D9D3EA"/>

  <!-- Company scene (left) -->
  <rect x="61" y="173" width="410" height="413" rx="16" fill="#231A45"/>
  <text x="86" y="230" fill="#FFFFFF" font-size="30" font-weight="700">NetCore</text>
  <text x="86" y="262" fill="#EEE9F9" font-size="20">Manufacturing Services GmbH</text>
  <text x="86" y="300" fill="#EEE9F9" font-size="18" fill-opacity="0.85">900 employees · three sites</text>
  <!-- three site markers -->
  <g fill="#6E8DC1">
    <rect x="90" y="330" width="90" height="70" rx="8"/>
    <rect x="200" y="330" width="90" height="70" rx="8" fill-opacity="0.8"/>
    <rect x="310" y="330" width="90" height="70" rx="8" fill-opacity="0.6"/>
  </g>
  <text x="112" y="372" fill="#FFFFFF" font-size="18">S1</text>
  <text x="222" y="372" fill="#FFFFFF" font-size="18">S2</text>
  <text x="332" y="372" fill="#FFFFFF" font-size="18">S3</text>
  <text x="86" y="450" fill="#EEE9F9" font-size="17" fill-opacity="0.85">A grown IT landscape:</text>
  <text x="86" y="476" fill="#EEE9F9" font-size="17" fill-opacity="0.85">many devices, several local</text>
  <text x="86" y="502" fill="#EEE9F9" font-size="17" fill-opacity="0.85">servers, rising cloud use.</text>
  <text x="86" y="548" fill="#F1B24A" font-size="17">Rising IT costs, no systematic</text>
  <text x="86" y="572" fill="#F1B24A" font-size="17">environmental view.</text>

  <!-- Point: increasing cloud use (x38% y24%) -->
  <path d="M778 240 q-40 0 -40 -34 q0 -30 34 -32 q7 -30 42 -30 q35 0 44 30 q30 2 30 32 q0 34 -40 34 z" fill="#B389D6" fill-opacity="0.85"/>
  <text x="778" y="214" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">cloud</text>

  <!-- Point: high availability (x44% y44%) -->
  <path d="M901 458 l34 14 v26 q0 30 -34 44 q-34 -14 -34 -44 v-26 z" fill="#6FB56A" fill-opacity="0.85"/>
  <text x="901" y="500" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">24/7</text>

  <text x="61" y="640" fill="#6B6484" font-size="18" font-style="italic">Placeholder art — swap for the generated illustration when ready.</text>

  <!-- Six finding panels (right) -->
  <!-- row 1 -->
  <g>
    <rect x="1100" y="12" width="467" height="369" rx="16" fill="#F1B24A" fill-opacity="0.12" stroke="#F1B24A" stroke-width="2"/>
    <text x="1333" y="180" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">Servers at</text>
    <text x="1333" y="214" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">low utilisation</text>
  </g>
  <g>
    <rect x="1581" y="12" width="461" height="369" rx="16" fill="#B389D6" fill-opacity="0.12" stroke="#B389D6" stroke-width="2"/>
    <text x="1811" y="180" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">Devices left on</text>
    <text x="1811" y="214" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">after hours</text>
  </g>
  <!-- row 2 -->
  <g>
    <rect x="1100" y="389" width="467" height="364" rx="16" fill="#6FB56A" fill-opacity="0.12" stroke="#6FB56A" stroke-width="2"/>
    <text x="1333" y="555" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">Fixed</text>
    <text x="1333" y="589" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">replacement cycles</text>
  </g>
  <g>
    <rect x="1581" y="389" width="461" height="364" rx="16" fill="#3F3552" fill-opacity="0.12" stroke="#3F3552" stroke-width="2"/>
    <text x="1811" y="555" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">No repair or</text>
    <text x="1811" y="589" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">reuse concept</text>
  </g>
  <!-- row 3 -->
  <g>
    <rect x="1100" y="763" width="467" height="343" rx="16" fill="#6E8DC1" fill-opacity="0.12" stroke="#6E8DC1" stroke-width="2"/>
    <text x="1333" y="920" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">Procurement</text>
    <text x="1333" y="954" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">on price alone</text>
  </g>
  <g>
    <rect x="1581" y="763" width="461" height="343" rx="16" fill="#F1B24A" fill-opacity="0.12" stroke="#F1B24A" stroke-width="2"/>
    <text x="1811" y="920" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">Sustainability data</text>
    <text x="1811" y="954" text-anchor="middle" fill="#1B1230" font-size="26" font-weight="600">hardly available</text>
  </g>
</svg>
